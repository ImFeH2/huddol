name: Platforms

on:
  workflow_call:
    outputs:
      matrix:
        description: Supported native build targets
        value: ${{ jobs.platforms.outputs.matrix }}

permissions:
  contents: read

jobs:
  platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read platforms
        id: matrix
        run: |
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const matrix = JSON.parse(readFileSync(".github/platforms.json", "utf8"));
            appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`);
          '
