pre-commit:
  fail_on_changes: always
  parallel: true
  jobs:
    - name: config
      run: pnpm format:config:check && pnpm check:config

    - name: web
      run: pnpm format:webui:check && pnpm check:webui && pnpm test:webui

    - name: core
      run: pnpm format:core:check && pnpm check:core && pnpm test:core

    - name: rust
      run: pnpm format:rust:check && pnpm check:rust && pnpm test:rust

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit "{1}"
