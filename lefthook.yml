commit-msg:
  jobs:
    - name: commit message
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: config
      run: pnpm check:config
    - name: web
      run: pnpm check:web && pnpm test:web
    - name: core
      run: pnpm check:core && pnpm test:core
    - name: rust
      run: pnpm check:rust && pnpm test:rust
